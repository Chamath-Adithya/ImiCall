name: Bug report
description: Report a reproducible problem using synthetic data.
body:
  - type: markdown
    attributes:
      value: Do not include private invitation links, contact exports, recordings or credentials. Security vulnerabilities must be reported privately; see SECURITY.md.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce and expected behavior
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device, OS and browser version
    validations:
      required: true
  - type: textarea
    id: conditions
    attributes:
      label: Relevant conditions
      description: HTTPS/local, relay or Direct mode, permission state and connection type. No secrets or personal data.
